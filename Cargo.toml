[package]
name = "md2toml"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "md2toml"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"
regex = "1.10"
anyhow = "1.0"
once_cell = "1.19"
thiserror = "1.0"
walkdir = "2.5"

[dev-dependencies]
assert_fs = "1.1"
predicates = "3.1"
pretty_assertions = "1.4"
