[package]
name = "md2toml"
version = "1.0.0"
edition = "2021"
authors = ["monshakeys"]
description = "md2toml - Slash Commands Converter"
repository = "https://github.com/monshakeys/md2toml"
keywords = ["claude-code", "gemini-cli", "slash-commands", "converter", "markdown-to-toml"]
categories = ["command-line-utilities", "development-tools"]
license = "MIT"

[[bin]]
name = "md2toml"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde_yaml = "0.9"
regex = "1.12"
once_cell = "1.21"
thiserror = "2.0"
walkdir = "2.5"

[dev-dependencies]
assert_fs = "1.1"
predicates = "3.1"
pretty_assertions = "1.4"
cargo-audit = "0.22"
tokio = { version = "1.48", features = ["full"] }
